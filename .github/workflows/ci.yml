name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }} · lint · typecheck · unit · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = the supported floor (maintenance LTS, matches package.json engines),
        # 24 = active LTS, 26 = current (LTS from 2026-10-28) and the dev version.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from package.json "packageManager".
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency boundaries
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  integration:
    name: integration (Postgres · pg-boss)
    runs-on: ubuntu-latest
    # Split from `verify` so the fast lane reports in ~1min while the
    # container-backed suite runs. Docker is preinstalled and running on
    # ubuntu-latest, so testcontainers works out of the box.
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Active LTS. Single version — the containers make this the slow lane,
          # and it exercises adapters, not language/runtime surface.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm run test:integration
